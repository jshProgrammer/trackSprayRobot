navigation:
  # =========================
  # GPIO PINS
  # =========================
  pin_left: 18  # PIN 12
  pin_right: 13 # PIN 33
  pin_spray: 12 # PIN 32

  # =========================
  # ESC PWM SETTINGS (µs)
  # =========================
  pwm_stop: 1500
  pwm_max_fwd: 2000
  pwm_max_bwd: 1000

  motor_frequency: 10000
  wheel_base: 0.445

  # =========================
  # DRIVE LIMITS
  # =========================
  max_linear: 0.6       # m/s – Plausibilitaetsgrenze fuer GPS-Sprungfilter
  max_angular: 0.4     # rad/s

  # =========================
  # SAFETY / TIMING
  # =========================
  cmd_timeout: 0.5
  forward_velocity:  0.1    # m/s – Normalgeschwindigkeit vorwärts
  angular_velocity:  0.5    # rad/s – Drehgeschwindigkeit

  #TODO: tried reducing this tolerance
  waypoint_tolerance: 0.3   # m – Waypoint gilt als erreicht

    # ── GPS-Qualität ───────────────────────────────────────────────────────
    # -1 = jeder Fix reicht  |  0 = normaler GPS-Fix  |  1 = nur RTK
  min_gps_status: 0

  # ── RTK-Stabilität, Ausreißer-Schutz & Spray-Bestätigung ───────────────
  rtk_stable_sec: 3.0          # s – so lange muss RTK ununterbrochen FIXED sein, bevor gestartet wird
  gps_timeout: 3.0             # s – ohne frischen FIXED stoppt der Roboter (kein Blindfahren)
  max_gps_jump: 0.40           # m – größere Positionssprünge pro Epoche werden verworfen
  spray_confirm_sec: 0.5       # s – so lange muss der Roboter in Toleranz stehen, bevor gesprüht wird
  require_fix_for_spray: true  # nur bei RTK FIXED (Quality 4) sprühen
  obstacle_margin: 1.0         # m – Abstand zum Hindernis beim Pfadcheck
  waypoint_pause_sec: 5.0      # s – Pause nach dem Sprühen (non-blocking)

  # ── Auto-Kalibrierung (Kinematic Alignment) ────────────────────────────
  calib_distance: 3.0          # m – so weit geradeaus fahren, bis der GPS-Vektor stabil ist
  calib_min_time: 3.0          # s – Mindestdauer der Kalibrierfahrt

  waypoints:
