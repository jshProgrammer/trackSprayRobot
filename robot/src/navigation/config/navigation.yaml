navigation:
  # =========================
  # GPIO PINS
  # =========================
  pin_left: 18  # PIN 12
  pin_right: 13 # PIN 33
  pin_spray: 12 # PIN 32

  # =========================
  # ESC PWM SETTINGS (µs)
  # =========================
  pwm_stop: 1500
  pwm_max_fwd: 2000
  pwm_max_bwd: 1000

  motor_frequency: 10000
  wheel_base: 0.445

  # =========================
  # DRIVE LIMITS
  # =========================
  max_linear: 0.15      # m/s
  max_angular: 0.4     # rad/s

  # =========================
  # SAFETY / TIMING
  # =========================
  cmd_timeout: 0.5
  forward_velocity:  0.1    # m/s – Normalgeschwindigkeit vorwärts
  angular_velocity:  0.5    # rad/s – Drehgeschwindigkeit

  #TODO: tried reducing this tolerance
  distance_tolerance: 0.15   # m – Waypoint gilt als erreicht
  angle_tolerance:   45.0   # Grad – ab wann dreht der Roboter

  # ── RTK-Stabilität, Pose-Frische & Dead-Reckoning ──────────────────────
  rtk_stable_sec: 3.0          # s – so lange muss RTK ununterbrochen FIXED sein, bevor gestartet wird
  max_deadreckon_sec: 5.0      # s – so lange darf der EKF max. ohne frischen FIXED per IMU weiterrechnen, dann Stop
  odom_timeout: 0.5            # s – EKF-Pose (/ekf/pose) darf nicht älter sein, sonst Stop (EKF-Node tot)
  calib_distance: 1.0          # m – Geradeausfahrt beim Start, damit der EKF das Heading über den GPS-Kurs einnordet
  steering_kp: 1.0             # P-Verstärkung der Lenkung

  # ── Spray-Bestätigung ──────────────────────────────────────────────────
  spray_confirm_sec: 0.5       # s – so lange muss der Roboter in Toleranz stehen, bevor gesprüht wird
  require_fix_for_spray: true  # nur bei RTK FIXED (Quality 4) sprühen
  waypoint_pause_sec: 5.0      # s – Pause nach dem Sprühen (non-blocking)

  waypoints:
    - [50.043672683333334, 10.207673066666667] # punkt hinten am parkplatz   bzw, 50.04367276666667, 10.20767285
