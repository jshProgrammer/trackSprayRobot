navigation:
  # =========================
  # GPIO PINS
  # =========================
  pin_left: 18  # PIN 12
  pin_right: 13 # PIN 33
  pin_spray: 12 # PIN 32

  # =========================
  # ESC PWM SETTINGS (µs)
  # =========================
  pwm_stop: 1500
  pwm_max_fwd: 2000
  pwm_max_bwd: 1000

  motor_frequency: 10000
  wheel_base: 0.445

  # =========================
  # DRIVE LIMITS
  # =========================
  max_linear: 0.15      # m/s
  max_angular: 0.4     # rad/s

  # =========================
  # SAFETY / TIMING
  # =========================
  cmd_timeout: 0.5
  forward_velocity:  0.1    # m/s – Normalgeschwindigkeit vorwärts
  angular_velocity:  0.5    # rad/s – Drehgeschwindigkeit

  #TODO: tried reducing this tolerance
  distance_tolerance: 0.3   # m – Waypoint gilt als erreicht
  angle_tolerance:   45.0   # Grad – ab wann dreht der Roboter

    # ── GPS-Qualität ───────────────────────────────────────────────────────
    # -1 = jeder Fix reicht  |  0 = normaler GPS-Fix  |  1 = nur RTK
  min_gps_status: 0

  waypoints:
    #- [50.043619166666666, 10.208639116666667]
    - [ 50.04362896666667, 10.208639033333334 ] # Punkt 1 markiert weiter vorne
    - [50.043524033333334, 10.208603316666666] # Punkt 2 markiert weiter hinten
    - [50.04374381666667, 10.20852155] # Punkt 3 nicht markiert!
