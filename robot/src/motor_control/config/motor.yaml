motor_driver:
  # =========================
  # GPIO PINS
  # =========================
  pin_right: 18  # PIN 12
  pin_right_reverse: 27
  right_motor_reversed: true
  pin_left: 13 # PIN 33
  pin_left_reverse: 17
  left_motor_reversed: false
  pin_spray: 12 # PIN 32
  hardware_pwm_gpios: [12, 13, 18, 19]

  encoder_right_a: 26
  encoder_right_b: 6
  encoder_right_c: 5
  encoder_left_a: 16
  encoder_left_b: 23
  encoder_left_c: 24
  encoder_hall_sequence: ["001", "101", "100", "110", "010", "011"]
  encoder_right_reversed: true
  encoder_left_reversed: false

  # TODO: reale Werte eintragen, bevor /wheel/twist im Kalman-Filter genutzt wird.
  wheel_radius: 0.1
  encoder_ticks_per_motor_revolution: 0
  encoder_motor_to_wheel_ratio: 1.0
  encoder_velocity_publish_rate: 20.0
  encoder_velocity_timeout: 0.25
  encoder_velocity_variance: 0.04
  use_encoder_velocity: true

  # =========================
  # ESC PWM SETTINGS (µs)
  # =========================
  pwm_stop: 1500
  pwm_max_fwd: 2000
  pwm_max_bwd: 1000

  motor_frequency: 10000
  wheel_base: 0.445

  # =========================
  # DRIVE LIMITS
  # =========================
  max_linear: 0.15      # m/s
  max_angular: 0.4     # rad/s

  # =========================
  # SAFETY / TIMING
  # =========================
  cmd_timeout: 0.5 
