motor_driver:
  # =========================
  # GPIO PINS
  # =========================
  pin_left: 18  # PIN 12
  pin_right: 13 # PIN 33
  pin_spray: 12 # PIN 32

  # =========================
  # ESC PWM SETTINGS (µs)
  # =========================
  pwm_stop: 1500
  pwm_max_fwd: 2000
  pwm_max_bwd: 1000

  motor_frequency: 10000
  wheel_base: 0.445

  # =========================
  # DRIVE LIMITS
  # =========================
  max_linear: 0.3      # m/s
  max_angular: 1.0     # rad/s

  # =========================
  # SAFETY / TIMING
  # =========================
  cmd_timeout: 0.5 