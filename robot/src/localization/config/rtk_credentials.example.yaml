# Beispiel fuer localization/launch/localization.launch.
# Nach rtk_credentials.yaml kopieren und echte NTRIP-Zugangsdaten eintragen.

ntrip_client:
  caster: "sapos-rtk.bayern.de"
  port: 2101
  mountpoint: "VRS_3_4G_BY"
  user: "DEIN_NTRIP_USERNAME"
  password: "DEIN_NTRIP_PASSWORD"
  serial_port: "/dev/ttyUSB0"
  serial_baud: 115200